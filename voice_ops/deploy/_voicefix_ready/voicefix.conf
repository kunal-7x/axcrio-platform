[Service]
# W-VOICE legacy fix — single-greeting + neutral prosody drop-in for famit-agent ONLY.
# Goes at: /etc/systemd/system/famit-agent.service.d/voicefix.conf
# NOT the shared /opt/famit-agent/.env (a value there leaks to aim-voice-agent +
# famit-caller on their next restart). Per-service flags live in the drop-in.
# Coexists with the existing kernel-outbound.conf (the kernel flag stays 0).
#
# WHY EnvironmentFile (not bare Environment=): the main unit declares
#   EnvironmentFile=/opt/famit-agent/.env  which ALSO sets EL_STABILITY (=0.55).
# When the same var is in both a unit EnvironmentFile= and a drop-in Environment=,
# systemd let the FILE win at exec time (proven: /proc/<pid>/environ showed 0.55
# while a bare drop-in Environment=0.65 lost). A drop-in EnvironmentFile= is parsed
# AFTER the main unit's EnvironmentFile=, so OUR file's values win deterministically
# — without editing the shared .env. This file is famit-agent-only; aim-voice-agent
# does not reference it.
#
#  OPENER_ALREADY_SAID=1  -> appends the "तुम पहले ही OPEN कर चुकी हो" block so the
#                            LLM does NOT re-greet on turn 1 (single greeting).
#  OPENER_IN_CTX=0        -> the spoken opener is NOT echoed into chat ctx as an
#                            assistant turn the model copies (no re-greet trigger).
#  EL_STABILITY=0.65      -> neutral, consistent delivery (was 0.55/0.45 = over-
#                            expressive, the pace/loudness swing the founder flagged).
#  EL_SPEED=1.0           -> true-neutral pace (was 1.08 = 8% fast).
EnvironmentFile=/etc/famit/voicefix.env
