# secrets CI — gitleaks on every push and PR (the CI-side net, full history).
# This is ACTIVE immediately (no path filter): any secret in ANY commit fails the run.
name: secrets
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so a secret in ANY commit is caught
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
