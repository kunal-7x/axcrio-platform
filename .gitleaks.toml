title = "famit-revenue-os gitleaks config"

[extend]
useDefault = true   # all built-in rules (AWS, GCP, generic API keys, private keys, JWT, etc.)

# Paths that are templates / pure structure (KEYS only, no values) — exempt from findings.
[[allowlists]]
description = "env + tfvars templates contain key names only, never values"
paths = [
  '''.*\.env\.example$''',
  '''.*\.env\.local\.example$''',
  '''.*\.tfvars\.example$''',
]

# The P0 design spec itself DOCUMENTS a fake secret as the pre-commit-hook test
# (a deliberately-fake `sk_live_...` string, see design/p0-foundation.md step 7).
# It is spec prose, not a live credential — exempt this one doc path so the gate
# does not red on our own instructions. (Scoped to the single design file.)
[[allowlists]]
description = "p0-foundation design doc contains a documented FAKE test secret, not a real one"
paths = [
  '''design/p0-foundation\.md$''',
]

# RESTORE-SYSTEM.md + earner-golden/README.md DOCUMENT the working voice brain:
# md5 hashes, the public ElevenLabs voice_id, and the non-secret tuning value
# `EL_STABILITY=0.55`. The generic-api-key rule mis-flags the `EL_STABILITY=0.55`
# tuning number as a credential — it is NOT a secret (it's a documented voice
# setting). Exempt these restore-doc paths.
[[allowlists]]
description = "restore docs hold md5s + public voice_id + non-secret tuning values, not credentials"
paths = [
  '''RESTORE-SYSTEM\.md$''',
  '''.*earner-golden/README\.md$''',
]

# The PVS tier config (llm_router/tiers.py) uses literal MODEL-NAME identifiers as
# rate-card keys (e.g. "groq-llama-3.3-70b", "groq-gpt-oss-20b"). gitleaks' generic
# high-entropy rule flags these hyphenated model labels as if they were secrets —
# they are NOT credentials, just public model identifiers. Allow these exact
# regex-matched strings (scoped to the literal model labels, not a path exemption).
[[allowlists]]
description = "tiers.py rate-keys are public model-name labels, not secrets"
regexes = [
  '''groq-(llama-3\.3-70b|gpt-oss-20b)''',
]
