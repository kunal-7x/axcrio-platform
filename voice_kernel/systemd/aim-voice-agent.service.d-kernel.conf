# voice_kernel inbound flag — systemd drop-in TEMPLATE (tracked, NOT auto-installed)
#
# WHY A DROP-IN, NOT THE SHARED .env (LEARNINGS §2, banked):
#   Inbound flags placed in the SHARED /opt/famit-agent/.env LEAK to the OUTBOUND
#   earner (agent.py) on its next restart, because both processes read the same
#   .env. That would silently flip kernel behaviour on the live earner. A systemd
#   drop-in scopes the variable to ONLY the inbound unit (aim-voice-agent),
#   so it can NEVER reach the outbound earner's process.
#
# HOW THE INTEGRATION WAVE INSTALLS IT (human-gated, on the inbound box only):
#   sudo mkdir -p /etc/systemd/system/aim-voice-agent.service.d
#   sudo cp aim-voice-agent.service.d-kernel.conf \
#           /etc/systemd/system/aim-voice-agent.service.d/kernel.conf
#   sudo systemctl daemon-reload && sudo systemctl restart aim-voice-agent
#
# VERIFY IT DID NOT LEAK TO THE EARNER (run on the box):
#   tr '\0' '\n' < /proc/$(pgrep -f 'aim_voice_agent')/environ | grep KERNEL   # -> KERNEL_INBOUND=1
#   tr '\0' '\n' < /proc/$(pgrep -f 'agent.py')/environ        | grep KERNEL   # -> (EMPTY: earner clean)
#
# Default stays OFF everywhere until this drop-in is explicitly installed.

[Service]
Environment=KERNEL_INBOUND=1
