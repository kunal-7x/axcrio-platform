# famit-agent (OUTBOUND earner) — W-VOICE-HEART systemd drop-in TEMPLATE
# (tracked, NOT auto-installed). Scopes the voice-heart env to ONLY the outbound
# earner process, never the shared .env (LEARNINGS §2 — a shared .env flag leaks
# across the inbound aim_voice_agent + the outbound earner on the next restart).
#
# THIS IS THE KERNEL-DRIVEN OUTBOUND VOICE HEART. It does two things, deployed in
# TWO SEPARATE founder-gated steps (one box-mutating variable at a time):
#
#   STEP 4 (prosody FIRST, smallest change) — pin the CONSTANT prosody derived from
#   the GOOD inbound voice the founder LOVED (_inbound_ref/aim_voice_agent.LIVE.py
#   :_build_tts => stability 0.45, speed 1.08, style 0, speaker_boost off). The old
#   outbound ran 0.65/1.0, tuned to fight a "swing" that was actually the worker's
#   opener+closer speech-event COLLISION (removed by agent.py Hunks H/I), NOT low
#   stability. With those events gone, 0.45/1.08 is expressive AND constant = the
#   loved inbound feel, identical on every utterance, no name-emphasis.
#     -> install with ONLY the two EL_ lines below (KERNEL_OUTBOUND still ABSENT),
#        place a real ring: the OLD brain now speaks in the constant inbound voice.
#     -> if the real ring disagrees, revert is one edit: EL_STABILITY=0.65 /
#        EL_SPEED=1.0 + restart (this is the documented prosody TENSION — the env
#        wins over the code default, so reverting needs no redeploy).
#
#   STEP 5 (flip the brain) — uncomment Environment=KERNEL_OUTBOUND=1. The kernel
#   now AUTHORS every word: the single greeting (script pattern: time-of-day wish ->
#   greetings from {company} -> confirm identity -> WAIT -> reason+permission), the
#   body, and the LLM-generated CLOSING — name said at most once/twice at constant
#   volume, natural Hinglish (no "mahatvapurn"), cross-vertical from the brief. The
#   worker's hardcoded opener/closer say()s are suppressed (agent.py Hunks H/I), so
#   there is exactly ONE speaker — mirroring the inbound the founder loved.
#
# HOW TO INSTALL (human-gated, on the OUTBOUND box only):
#   sudo mkdir -p /etc/systemd/system/famit-agent.service.d
#   sudo cp famit-agent.service.d-voice-heart.conf \
#           /etc/systemd/system/famit-agent.service.d/voice-heart.conf
#   sudo systemctl daemon-reload && sudo systemctl restart famit-agent
#
# VERIFY IT DID NOT LEAK TO THE INBOUND AGENT (run on the box):
#   tr '\0' '\n' < /proc/$(pgrep -f 'aim_voice_agent')/environ | grep -E 'KERNEL_OUTBOUND|EL_'  # -> EMPTY
#   tr '\0' '\n' < /proc/$(pgrep -f '[/ ]agent.py')/environ    | grep -E 'KERNEL_OUTBOUND|EL_'  # -> set
#
# REVERT (instant, always armed):
#   * voice swing/too-fast -> EL_STABILITY=0.65 / EL_SPEED=1.0 + restart
#   * brain regression      -> comment KERNEL_OUTBOUND (or =0) + restart -> old brain,
#                              perfect voice (zero voice-engine risk; the TTS engine
#                              + voice_id QTKSa2Iyv0yoxvXY2V8a were never touched)
#   * total                 -> cp agent.py.HEARTbak agent.py + restore .env + restart

[Service]
# STEP 4 — constant prosody (the derived inbound voice). Pin these FIRST, alone.
Environment=EL_STABILITY=0.45
Environment=EL_SPEED=1.08
Environment=EL_SIMILARITY=0.80
# STEP 5 — flip the brain (uncomment ONLY after the prosody-only ring is good).
#Environment=KERNEL_OUTBOUND=1
