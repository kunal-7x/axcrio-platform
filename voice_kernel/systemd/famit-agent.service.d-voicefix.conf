# famit-agent (OUTBOUND earner) — W-VOICE-FIX systemd drop-in TEMPLATE
# (tracked, NOT auto-installed). Scopes the fix env to ONLY the outbound earner
# process, never the shared .env (LEARNINGS §2 — shared .env leaks across the
# inbound agent + the outbound earner on the next restart).
#
# WHAT THIS SETS (all already DEFAULT in the branch code — this drop-in only
# documents / pins the live box so a value can be tuned without a redeploy):
#   OPENER_ALREADY_SAID=1  — suppress the turn-1 LLM re-greeting (BUG2 double greet)
#   OPENER_IN_CTX=0        — do NOT echo the spoken opener as a copy-able chat turn
#   EL_STABILITY=0.65      — NEUTRAL/consistent ElevenLabs delivery (BUG4) (was 0.45)
#   EL_SPEED=1.0           — true-neutral speaking rate (BUG4) (was 1.08)
#
# NOTE: KERNEL_OUTBOUND is intentionally ABSENT here — the kernel cutover stays
# gated OFF (default). This drop-in fixes the LEGACY path only; it does not flip
# the kernel. The kernel cutover is a separate, founder-gated, one-box-mutating
# step (its own drop-in sets KERNEL_OUTBOUND=1).
#
# HOW TO INSTALL (human-gated, on the OUTBOUND box only):
#   sudo mkdir -p /etc/systemd/system/famit-agent.service.d
#   sudo cp famit-agent.service.d-voicefix.conf \
#           /etc/systemd/system/famit-agent.service.d/voicefix.conf
#   sudo systemctl daemon-reload && sudo systemctl restart famit-agent
#
# VERIFY IT DID NOT LEAK TO THE INBOUND AGENT (run on the box):
#   tr '\0' '\n' < /proc/$(pgrep -f 'agent.py')/environ        | grep -E 'OPENER|EL_'  # -> set
#   tr '\0' '\n' < /proc/$(pgrep -f 'aim_voice_agent')/environ | grep -E 'OPENER|EL_'  # -> EMPTY
#
# REVERT (restore the old double-greet / expressive delivery): remove this file +
# daemon-reload + restart, OR set OPENER_ALREADY_SAID=0 / EL_STABILITY=0.45 / EL_SPEED=1.08.

[Service]
Environment=OPENER_ALREADY_SAID=1
Environment=OPENER_IN_CTX=0
Environment=EL_STABILITY=0.65
Environment=EL_SPEED=1.0
