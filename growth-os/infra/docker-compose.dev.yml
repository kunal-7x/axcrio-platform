# GROWTH OS — local dev stack (BUILD-SPEC §4 / §20 / architecture-phase0.md D8).
#
# Boots the 6 backbone dependencies the platform runs against:
#   postgres16 · redpanda (+console) · redis · clickhouse · temporal (+UI) · minio
#
# ⚠ HONEST ENV NOTE: this whole stack needs a real box. The dev laptop is too small to run all
# six containers comfortably and the DO droplet quota is 3/3 full, so production needs a box /
# limit-raise (or managed Postgres+ClickHouse+Kafka-API+Temporal-Cloud). This file is written +
# statically validated (`docker compose config`) but is NOT booted here. See infra/README.md.
#
# Pinned image tags = reproducibility (P12 boring tech). Bump deliberately + re-test connectors (§22).
# All data persists in named volumes; nothing here is multi-tenant by itself — tenant isolation is
# enforced in the app layer (Postgres RLS, ClickHouse tenant_id sort keys) per §5.1, P6.

name: growth-os-dev

services:
  # ---- OLTP: Postgres 16 (schema-per-service, RLS ON day one — §5.1) ----
  postgres:
    image: postgres:16.4-alpine
    container_name: gos-postgres
    environment:
      POSTGRES_USER: growthos
      POSTGRES_PASSWORD: growthos_dev
      POSTGRES_DB: growthos
      # uuidv7-friendly; app sets per-request RLS GUC app.current_tenant (D7/§5.1).
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growthos -d growthos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- Event bus: Redpanda (Kafka API) — §6 nervous system ----
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: gos-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "9092:9092"     # Kafka API (host)
      - "8081:8081"     # Schema Registry (JSON Schema — §4)
      - "8082:8082"     # HTTP proxy
      - "9644:9644"     # admin
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- Redpanda Console (topic + schema-registry UI) ----
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: gos-redpanda-console
    depends_on:
      redpanda:
        condition: service_started
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8088:8080"
    restart: unless-stopped

  # ---- Cache / locks / rate-limit buckets (§5.3) ----
  redis:
    image: redis:7.4-alpine
    container_name: gos-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---- Analytics: ClickHouse (events_raw forever + metrics layer — §8.5) ----
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: gos-clickhouse
    environment:
      CLICKHOUSE_USER: growthos
      CLICKHOUSE_PASSWORD: growthos_dev
      CLICKHOUSE_DB: growthos
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"     # HTTP
      - "9000:9000"     # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---- Durable workflows: Temporal (CampaignLifecycle, LaunchSaga, OptimizationTick — §7.8) ----
  # Temporal needs its own Postgres; we use a separate DB on the same server to keep the stack small.
  temporal:
    image: temporalio/auto-setup:1.25.1
    container_name: gos-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: growthos
      POSTGRES_PWD: growthos_dev
      POSTGRES_SEEDS: postgres
      # auto-setup creates the temporal + temporal_visibility databases on first boot.
    ports:
      - "7233:7233"     # gRPC (workers connect here)
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: gos-temporal-ui
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"
    restart: unless-stopped

  # ---- Object store: MinIO (S3 API; DAM assets, exports — §4) ----
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: gos-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: growthos
      MINIO_ROOT_PASSWORD: growthos_dev
    ports:
      - "9002:9000"     # S3 API (9000 is taken by clickhouse-native on host)
      - "9001:9001"     # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redpandadata:
  redisdata:
  chdata:
  miniodata:
