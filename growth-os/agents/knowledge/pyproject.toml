# knowledge — GROWTH OS intelligence-plane agent (uv workspace member). Phase-0 skeleton.
[project]
name = "growth_os_knowledge"
version = "0.0.0"
description = "GROWTH OS agent: knowledge. FastAPI service. Code lands in its build phase (§21)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growth_os_knowledge"]
